        const ParticleCanvas = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resizeCanvas = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                const particles = [];
                const particleCount = Math.min(Math.floor(window.innerWidth / 20), 65);

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2 + 0.8,
                        color: Math.random() > 0.5 ? '#00f0ff' : '#ec4899',
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8,
                        alpha: Math.random() * 0.5 + 0.2
                    });
                }

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < 130) {
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 130)})`;
                                ctx.lineWidth = 0.6;
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.alpha;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = p.color;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                        ctx.shadowBlur = 0;
                    });

                    animationFrameId = requestAnimationFrame(draw);
                };

                draw();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-60" />;
        };

                                            onChange={(e) => setContactForm({...contactForm, message: e.target.value})}
                                            placeholder="כתוב לי כאן את ההודעה..."
                                            className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none focus:shadow-[0_0_15px_rgba(0,240,255,0.3)] transition resize-none"
                                        ></textarea>
                                    </div>
                                    <button 
                                        type="submit"
                                        disabled={formStatus === 'sending'}
                                        className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950 font-black text-sm shadow-xl shadow-cyan-500/20 hover:shadow-[0_0_25px_rgba(0,240,255,0.7)] hover:scale-[1.01] transition duration-300 flex items-center justify-center gap-2"
                                    >
                                        {formStatus === 'sending' ? 'שולח הודעה...' : '✉️ שליחת הודעה'}
                                    </button>

                                    {formStatus === 'success' && (
                                        <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-center text-xs">
                                            ההודעה נשלחה בהצלחה! אצור איתך קשר בהקדם.
                                        </div>
                                    )}

                                    {formStatus === 'error' && (
                                        <div className="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-center text-xs">
                                            אירעה שגיאה בשליחה. אנא נסה שנית או פנה אליי בוואטסאפ.
                                        </div>
                                    )}
                                </form>

                                <div className="flex flex-wrap items-center justify-center gap-4 pt-4 border-t border-slate-800/80">
                                    <a 
                                        href="https://api.whatsapp.com/send?phone=972500000000" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="px-6 py-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-500 hover:text-slate-950 font-bold text-xs transition duration-300 flex items-center gap-2"
                                    >
                                        <span>💬</span> פנייה מהירה בוואטסאפ
                                    </a>
                                    <a 
                                        href="https://github.com/EladPereg" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="px-6 py-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-cyan-400 text-white font-bold text-xs transition duration-300 flex items-center gap-2"
                                    >
                                        <span>💻</span> פרופיל GitHub
                                    </a>
                                </div>
                            </div>
                        </section>

                    </main>

                    {/* CV VIEW MODAL (VIEW ONLY - NO DOWNLOAD) */}
                    {isCvOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
                            <div className="glass-card rounded-3xl w-full max-w-4xl h-[85vh] flex flex-col border border-purple-500/40 shadow-[0_0_50px_rgba(168,85,247,0.3)] overflow-hidden relative">
                                <div className="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-900/90">
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></span>
                                        <h3 className="font-bold text-white text-sm">קורות חיים – אלעד פרג (צפייה בלבד)</h3>
                                    </div>
                                    <button 
                                        onClick={() => setIsCvOpen(false)}
                                        className="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:bg-red-500 hover:text-white flex items-center justify-center transition"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <div 
                                    className="flex-1 bg-slate-950 p-6 overflow-y-auto select-none"
                                    onContextMenu={(e) => e.preventDefault()}
                                >
                                    <div className="max-w-2xl mx-auto space-y-6 text-right bg-slate-900/50 p-8 rounded-2xl border border-slate-800">
                                        <div className="border-b border-slate-800 pb-4">
                                            <h2 className="text-2xl font-black text-cyan-400">אלעד פרג</h2>
                                            <p className="text-xs text-slate-400 code-font">Full Stack Developer | Embedded Engineer | Maker Instructor</p>
                                        </div>
                                        <div className="space-y-2 text-xs text-slate-300">
                                            <h4 className="font-bold text-purple-400">השכלה:</h4>
                                            <p>• תואר ראשון בהוראה (B.Ed) – מכללת אורות ישראל.</p>
                                            <p>• בוגר קורס Full Stack Web Development – SVcollege רחובות.</p>
                                            <p>• הנדסאי אלקטרוניקה בהתמחות מחשבים – המכללה הטכנולוגית באר שבע.</p>
                                        </div>
                                        <div className="space-y-2 text-xs text-slate-300">
                                            <h4 className="font-bold text-purple-400">ניסיון מקצועי:</h4>
                                            <p>• מנהל צוות תחזוקה למערכות אנרגיה סולארית.</p>
                                            <p>• מדריך קורסי Maker ו-STEM לתלמידי חטיבות היסודי והביניים.</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-3 bg-slate-900/90 border-t border-slate-800 text-center text-[11px] text-slate-400">
                                    מסמך זה מוגן לצפייה ישירה בלבד.
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="border-t border-slate-800/80 bg-slate-950/80 py-8 px-4 text-center text-xs text-slate-500 code-font">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                © {new Date().getFullYear()} ELAD PEREG. DESIGNED WITH REACT & TAILWIND.
                            </div>
                            <div className="flex gap-4 text-slate-400">
                                <a href="#about" className="hover:text-cyan-400 transition">TOP</a>
                                <span>•</span>
                                <a href="#apps" className="hover:text-cyan-400 transition">APPS</a>
                                <span>•</span>
                                <a href="#capstone" className="hover:text-cyan-400 transition">CAPSTONE</a>
                            </div>
                        </div>
                    </footer>

                    {/* Canvas Floating Nodes Background */}
                    <ParticleCanvas />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
