        const ParticleCanvas = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resizeCanvas = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                const particles = [];
                const particleCount = Math.min(Math.floor(window.innerWidth / 20), 65);

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2 + 0.8,
                        color: Math.random() > 0.5 ? '#00f0ff' : '#ec4899',
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8,
                        alpha: Math.random() * 0.5 + 0.2
                    });
                }

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < 130) {
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 130)})`;
                                ctx.lineWidth = 0.6;
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.alpha;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = p.color;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                        ctx.shadowBlur = 0;
                    });

                    animationFrameId = requestAnimationFrame(draw);
                };

                draw();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-60" />;
        };

                                            <span className="font-bold text-slate-100 dark:text-slate-100">{s.name}</span>
                                        </div>
                                        <div className="w-full h-2.5 bg-slate-900 dark:bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-800">
                                            <div className={`h-full rounded-full ${s.color} transition-all duration-1000`} style={{ width: `${s.level}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section id="contact" className="pt-6">
                            <div className="glass-card rounded-3xl p-8 sm:p-12 relative overflow-hidden space-y-8 border-cyan-500/30">
                                <div className="max-w-2xl mx-auto text-center space-y-4">
                                    <h2 className="text-3xl sm:text-5xl font-black text-white">
                                        {t.contactHeading}
                                    </h2>
                                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                                        {t.contactSub}
                                    </p>
                                </div>

                                <form onSubmit={handleContactSubmit} className="max-w-xl mx-auto space-y-4 text-start">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-xs text-slate-300 font-bold">{t.labelName}</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={contactForm.name}
                                                onChange={(e) => setContactForm({...contactForm, name: e.target.value})}
                                                className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none"
                                            />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-xs text-slate-300 font-bold">{t.labelEmail}</label>
                                            <input 
                                                type="email" 
                                                required
                                                value={contactForm.email}
                                                onChange={(e) => setContactForm({...contactForm, email: e.target.value})}
                                                className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs text-slate-300 font-bold">{t.labelMsg}</label>
                                        <textarea 
                                            rows="4" 
                                            required
                                            value={contactForm.message}
                                            onChange={(e) => setContactForm({...contactForm, message: e.target.value})}
                                            className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none resize-none"
                                        ></textarea>
                                    </div>
                                    <button 
                                        type="submit"
                                        disabled={formStatus === 'sending'}
                                        className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 text-slate-950 font-black text-sm shadow-xl hover:scale-[1.01] transition duration-300 flex items-center justify-center gap-2"
                                    >
                                        {formStatus === 'sending' ? t.msgSending : t.btnSend}
                                    </button>

                                    {formStatus === 'success' && (
                                        <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-center text-xs font-bold">
                                            {t.msgSuccess}
                                        </div>
                                    )}

                                    {formStatus === 'error' && (
                                        <div className="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-center text-xs">
                                            {t.msgError}
                                        </div>
                                    )}
                                </form>

                                <div className="flex flex-wrap items-center justify-center gap-4 pt-4 border-t border-slate-800/80">
                                    <a 
                                        href="https://api.whatsapp.com/send?phone=972505941445" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="px-6 py-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-500 hover:text-slate-950 font-bold text-xs transition duration-300 flex items-center gap-2"
                                    >
                                        <span>💬</span> WhatsApp: 050-5941445
                                    </a>
                                    <a 
                                        href="mailto:Elado841@gmail.com" 
                                        className="px-6 py-3 rounded-xl bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-500 hover:text-slate-950 font-bold text-xs transition duration-300 flex items-center gap-2"
                                    >
                                        <span>✉️</span> Elado841@gmail.com
                                    </a>
                                </div>
                            </div>
                        </section>

                    </main>

                    {/* FULLY SYNCHRONIZED TRANSLATED CV MODAL */}
                    {isCvOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-6 bg-slate-950/85 backdrop-blur-xl animate-fadeIn">
                            <div className="w-full max-w-4xl h-[90vh] flex flex-col rounded-3xl shadow-2xl overflow-hidden relative border transition-colors duration-300"
                                style={{
                                    backgroundColor: theme === 'light' ? '#ffffff' : '#0f172a',
                                    borderColor: theme === 'light' ? '#cbd5e1' : 'rgba(168, 85, 247, 0.5)',
                                    color: theme === 'light' ? '#0f172a' : '#f3f4f6'
                                }}
                            >
                                
                                <div className="flex items-center justify-between px-6 py-4 border-b transition-colors duration-300"
                                    style={{
                                        backgroundColor: theme === 'light' ? '#f1f5f9' : 'rgba(15, 23, 42, 0.9)',
                                        borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b'
                                    }}
                                >
                                    <div className="flex items-center gap-3">
                                        <span className="w-3.5 h-3.5 rounded-full bg-purple-500 animate-pulse"></span>
                                        <div>
                                            <h3 className="font-extrabold text-base sm:text-lg" style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>
                                                {t.cvModalHeader}
                                            </h3>
                                            <p className="text-[11px] code-font opacity-80" style={{ color: theme === 'light' ? '#475569' : '#c084fc' }}>
                                                {lang === 'he' ? 'בס"ד | לצפייה בלבד' : 'Secure View Only'}
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setIsCvOpen(false)}
                                        className="w-10 h-10 rounded-full flex items-center justify-center transition font-extrabold text-base shadow-md border hover:bg-red-500 hover:text-white"
                                        style={{
                                            backgroundColor: theme === 'light' ? '#e2e8f0' : '#1e293b',
                                            color: theme === 'light' ? '#0f172a' : '#f8fafc',
                                            borderColor: theme === 'light' ? '#cbd5e1' : '#334155'
                                        }}
                                        title="סגור"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div 
                                    className="flex-1 p-4 sm:p-8 overflow-y-auto select-none space-y-6 text-start transition-colors duration-300"
                                    style={{
                                        backgroundColor: theme === 'light' ? '#f8fafc' : 'rgba(3, 7, 18, 0.9)',
                                    }}
                                    onContextMenu={(e) => e.preventDefault()}
                                >
                                    {/* Personal Info Box */}
                                    <div className="p-6 rounded-2xl border space-y-3 transition-colors duration-300"
                                        style={{
                                            backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                            borderColor: theme === 'light' ? '#cbd5e1' : 'rgba(168, 85, 247, 0.3)'
                                        }}
                                    >
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-3"
                                            style={{ borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}
                                        >
                                            <div>
                                                <h1 className="text-3xl font-black tracking-wide" style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{t.name}</h1>
                                                <p className="text-sm font-bold code-font" style={{ color: theme === 'light' ? '#7c3aed' : '#c084fc' }}>{cv.title}</p>
                                            </div>
                                            <div className="text-xs space-y-1 code-font" style={{ color: theme === 'light' ? '#334155' : '#cbd5e1' }}>
                                                <p>{cv.location}</p>
                                                <p>📞 050-5941445</p>
                                                <p>✉️ Elado841@gmail.com</p>
                                            </div>
                                        </div>
                                        <p className="text-xs leading-relaxed" style={{ color: theme === 'light' ? '#1e293b' : '#cbd5e1' }}>
                                            <strong style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{cv.summaryTitle}</strong> {cv.summaryText}
                                        </p>
                                    </div>

                                    {/* Technical Skills */}
                                    <div className="p-5 rounded-2xl border space-y-3 transition-colors duration-300"
                                        style={{
                                            backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                            borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b'
                                        }}
                                    >
                                        <h4 className="text-sm font-bold flex items-center gap-2 border-b pb-2"
                                            style={{ color: theme === 'light' ? '#0284c7' : '#22d3ee', borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}
                                        >
                                            <span>🛠️</span> {cv.skillsHeader.replace('🛠️ ', '')}
                                        </h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                            <div className="space-y-1">
                                                <p className="font-bold" style={{ color: theme === 'light' ? '#7c3aed' : '#d8b4fe' }}>{cv.skills1Title}</p>
                                                <p style={{ color: theme === 'light' ? '#475569' : '#94a3b8' }}>{cv.skills1Desc}</p>
                                            </div>
                                            <div className="space-y-1">
                                                <p className="font-bold" style={{ color: theme === 'light' ? '#7c3aed' : '#d8b4fe' }}>{cv.skills2Title}</p>
                                                <p style={{ color: theme === 'light' ? '#475569' : '#94a3b8' }}>{cv.skills2Desc}</p>
                                            </div>
                                            <div className="sm:col-span-2 space-y-1 border-t pt-2" style={{ borderColor: theme === 'light' ? '#e2e8f0' : 'rgba(30, 41, 59, 0.6)' }}>
                                                <p className="font-bold" style={{ color: theme === 'light' ? '#7c3aed' : '#d8b4fe' }}>{cv.skills3Title}</p>
                                                <p style={{ color: theme === 'light' ? '#475569' : '#94a3b8' }}>{cv.skills3Desc}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Capstone Project */}
                                    <div className="p-5 rounded-2xl border space-y-3 transition-colors duration-300"
                                        style={{
                                            backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                            borderColor: theme === 'light' ? '#cbd5e1' : 'rgba(168, 85, 247, 0.3)'
                                        }}
                                    >
                                        <h4 className="text-sm font-bold flex items-center gap-2 border-b pb-2"
                                            style={{ color: theme === 'light' ? '#7c3aed' : '#c084fc', borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}
                                        >
                                            <span>🛡️</span> {cv.projectHeader.replace('🛡️ ', '')}
                                        </h4>
                                        <div className="space-y-2 text-xs">
                                            <p className="font-bold text-sm" style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{cv.projectName}</p>
                                            <ul className="list-disc list-inside space-y-1" style={{ color: theme === 'light' ? '#1e293b' : '#cbd5e1' }}>
                                                {cv.projectBullets.map((bullet, idx) => (
                                                    <li key={idx}>{bullet}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>

                                    {/* Professional Experience */}
                                    <div className="p-5 rounded-2xl border space-y-3 transition-colors duration-300"
                                        style={{
                                            backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                            borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b'
                                        }}
                                    >
                                        <h4 className="text-sm font-bold flex items-center gap-2 border-b pb-2"
                                            style={{ color: theme === 'light' ? '#d97706' : '#fbbf24', borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}
                                        >
                                            <span>💼</span> {cv.expHeader.replace('💼 ', '')}
                                        </h4>
                                        <div className="space-y-4 text-xs">
                                            <div className="space-y-1">
                                                <div className="flex justify-between font-bold">
                                                    <span style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{cv.exp1Title}</span>
                                                    <span className="code-font" style={{ color: theme === 'light' ? '#b45309' : '#fbbf24' }}>{cv.exp1Date}</span>
                                                </div>
                                                <ul className="list-disc list-inside space-y-1" style={{ color: theme === 'light' ? '#475569' : '#94a3b8' }}>
                                                    {cv.exp1Bullets.map((b, idx) => (
                                                        <li key={idx}>{b}</li>
                                                    ))}
                                                </ul>
                                            </div>

                                            <div className="space-y-1 border-t pt-3" style={{ borderColor: theme === 'light' ? '#e2e8f0' : 'rgba(30, 41, 59, 0.6)' }}>
                                                <div className="flex justify-between font-bold">
                                                    <span style={{ color: theme === 'light' ? '#0f172a' : '#ffffff' }}>{cv.exp2Title}</span>
                                                </div>
                                                <ul className="list-disc list-inside space-y-1" style={{ color: theme === 'light' ? '#475569' : '#94a3b8' }}>
                                                    {cv.exp2Bullets.map((b, idx) => (
                                                        <li key={idx}>{b}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Education & Military */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="p-5 rounded-2xl border space-y-2 transition-colors duration-300"
                                            style={{
                                                backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                                borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b'
                                            }}
                                        >
                                            <h4 className="text-sm font-bold border-b pb-2" style={{ color: theme === 'light' ? '#059669' : '#34d399', borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}>{cv.eduHeader}</h4>
                                            <div className="space-y-1.5 text-xs" style={{ color: theme === 'light' ? '#1e293b' : '#cbd5e1' }}>
                                                <p>{cv.edu1}</p>
                                                <p>{cv.edu2}</p>
                                                <p>{cv.edu3}</p>
                                            </div>
                                        </div>

                                        <div className="p-5 rounded-2xl border space-y-2 transition-colors duration-300"
                                            style={{
                                                backgroundColor: theme === 'light' ? '#ffffff' : 'rgba(15, 23, 42, 0.6)',
                                                borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b'
                                            }}
                                        >
                                            <h4 className="text-sm font-bold border-b pb-2" style={{ color: theme === 'light' ? '#0284c7' : '#22d3ee', borderColor: theme === 'light' ? '#e2e8f0' : '#1e293b' }}>{cv.milHeader}</h4>
                                            <div className="space-y-1.5 text-xs" style={{ color: theme === 'light' ? '#1e293b' : '#cbd5e1' }}>
                                                <p>{cv.mil1}</p>
                                                <p>{cv.mil2}</p>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div className="p-3 border-t text-center text-[11px] code-font transition-colors duration-300"
                                    style={{
                                        backgroundColor: theme === 'light' ? '#f1f5f9' : 'rgba(15, 23, 42, 0.9)',
                                        borderColor: theme === 'light' ? '#cbd5e1' : '#1e293b',
                                        color: theme === 'light' ? '#475569' : '#94a3b8'
                                    }}
                                >
                                    {t.cvModalNotice}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800/80 bg-slate-950/80 py-8 px-4 text-center text-xs text-slate-500 code-font">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                © {new Date().getFullYear()} ELAD PEREG. DESIGNED WITH REACT & TAILWIND.
                            </div>
                        </div>
                    </footer>

                    <ParticleCanvas />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
